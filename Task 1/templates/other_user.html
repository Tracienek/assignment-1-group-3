<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>My Account</title>

        <link
            rel="stylesheet"
            href="{{ url_for('static', filename='style.css') }}"
        />
    </head>

    <body class="user-layout other-user-page">
        <div class="main-layout">
            <!-- Back to forum -->
            <a href="{{ url_for('forum') }}" class="back-link">
                <svg
                    class="icon-sm"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>

                Back to forum
            </a>

                <!-- Right column: Activity History -->
                <div class="post-list my-posts history-section">
                    <h3>Activity History</h3>

                    <div class="user-posts-list">
                        {% for post in posts %}
                        <div class="history-row-item">
                            <div class="history-meta-box">
                                <strong class="user-post-title">
                                    {{ post.subject }}
                                </strong>

                                <span class="history-item-time">
                                    {{ post.created_at | vn_datetime }}
                                </span>

                                <!-- Hover preview -->
                                <div class="history-floating-tooltip">
                                    <p class="history-tooltip-text">
                                        {{ post.message_text or 'No message text
                                        provided.' }}
                                    </p>

                                    {% if post.image_url %}
                                    <img
                                        src="{{ post.image_url }}"
                                        alt="Post preview"
                                        class="history-image-contained"
                                    />
                                    {% endif %}
                                </div>
                            </div>
                        </div>

                        {% else %}

                        <p class="empty-state no-border-bg">
                            This user hasn't posted anything yet.
                        </p>

                        {% endfor %}
                    </div>
                </div>
            </div>
        </div>

        <script src="{{ url_for('static', filename='main.js') }}"></script>
    </body>
</html>
